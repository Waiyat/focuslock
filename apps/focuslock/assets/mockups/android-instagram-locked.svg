<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1080" y2="1920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172321"/>
      <stop offset=".48" stop-color="#10151B"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="glass" x1="143" y1="527" x2="925" y2="1424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182522" stop-opacity=".94"/>
      <stop offset=".48" stop-color="#111B1D" stop-opacity=".91"/>
      <stop offset="1" stop-color="#10151B" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="green" x1="186" y1="1250" x2="895" y2="1370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A2FF78"/>
      <stop offset="1" stop-color="#76F756"/>
    </linearGradient>
    <linearGradient id="insta" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD776"/>
      <stop offset=".38" stop-color="#FF5C74"/>
      <stop offset=".72" stop-color="#C135B5"/>
      <stop offset="1" stop-color="#515BD4"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="matrix(0 550 -610 0 855 616)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46DFA8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#46DFA8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-120" y="-100" width="1320" height="2120" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="305" y="538" width="470" height="400" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="shadow" x="68" y="455" width="944" height="1010" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="32"/>
      <feOffset dy="24"/>
      <feComponentTransfer>
        <feFuncA slope=".38" type="linear"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect width="1080" height="1920" rx="68"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1080" height="1920" fill="url(#wallpaper)"/>
    <ellipse cx="855" cy="616" fill="url(#orb)" rx="610" ry="550"/>

    <!-- Dimmed app beneath the enforcement screen -->
    <g opacity=".44">
      <rect x="56" y="116" width="968" height="116" rx="24" fill="#15191D"/>
      <circle cx="113" cy="174" r="31" fill="url(#insta)"/>
      <rect x="162" y="156" width="242" height="17" rx="8.5" fill="#F1F1F1" opacity=".78"/>
      <rect x="162" y="184" width="154" height="12" rx="6" fill="#A9B0B5" opacity=".65"/>
      <circle cx="946" cy="174" r="5" fill="#ECEDEF"/>
      <circle cx="964" cy="174" r="5" fill="#ECEDEF"/>
      <circle cx="982" cy="174" r="5" fill="#ECEDEF"/>
      <rect x="56" y="263" width="968" height="510" rx="28" fill="#46665A"/>
      <path d="M56 639 324 414l163 145 178-217 359 311v120H56V639Z" fill="#799283" opacity=".72"/>
      <circle cx="805" cy="383" r="49" fill="#D7C48F" opacity=".72"/>
      <rect x="56" y="798" width="968" height="28" rx="14" fill="#E6EBE6" opacity=".28"/>
      <rect x="56" y="847" width="596" height="20" rx="10" fill="#E6EBE6" opacity=".22"/>
      <rect x="56" y="914" width="968" height="427" rx="28" fill="#26332D"/>
      <circle cx="130" cy="982" r="30" fill="url(#insta)"/>
      <rect x="181" y="967" width="234" height="16" rx="8" fill="#E7E9E7" opacity=".72"/>
      <rect x="56" y="1027" width="968" height="314" rx="6" fill="#36443A"/>
      <path d="M56 1260 326 1093l199 138 213-171 286 203v78H56v-81Z" fill="#697A69" opacity=".7"/>
      <rect x="56" y="1392" width="968" height="290" rx="28" fill="#1D2422"/>
      <rect x="56" y="1726" width="968" height="102" rx="30" fill="#12171A"/>
    </g>
    <rect width="1080" height="1920" fill="#030708" opacity=".42"/>
    <rect width="1080" height="1920" fill="#06100D" opacity=".18"/>

    <!-- Android status bar -->
    <text x="68" y="77" fill="#F5F7F6" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">9:41</text>
    <g fill="#F5F7F6" opacity=".94">
      <path d="M887 58h9v20h-9zM901 52h9v26h-9zM915 46h9v32h-9z"/>
      <path d="M940 56c16-15 37-15 53 0l-26 29-27-29Z"/>
      <rect x="1002" y="52" width="45" height="26" rx="6" stroke="#F5F7F6" stroke-width="3" fill="none"/>
      <rect x="1048" y="60" width="5" height="10" rx="2" fill="#F5F7F6"/>
      <rect x="1007" y="57" width="31" height="16" rx="3"/>
    </g>

    <!-- FocusLock enforcement modal -->
    <g filter="url(#shadow)">
      <rect x="108" y="505" width="864" height="922" rx="54" fill="url(#glass)" stroke="#E8FFF0" stroke-opacity=".20" stroke-width="2"/>
      <path d="M164 507h752c25 0 45 20 45 45v3H119v-3c0-25 20-45 45-45Z" fill="#FFFFFF" fill-opacity=".045"/>
      <path d="M132 569c0-17 14-31 31-31h754" stroke="#B7FFD0" stroke-opacity=".17" stroke-width="2"/>
    </g>

    <!-- Glowing lock badge -->
    <circle cx="540" cy="703" r="114" fill="#76F756" fill-opacity=".20" filter="url(#glow)"/>
    <circle cx="540" cy="703" r="82" fill="#76F756" fill-opacity=".10" stroke="#A4FF89" stroke-opacity=".40" stroke-width="2"/>
    <circle cx="540" cy="703" r="62" fill="#76F756" fill-opacity=".14"/>
    <rect x="510" y="696" width="60" height="49" rx="11" stroke="#A5FF8B" stroke-width="7"/>
    <path d="M522 696v-16c0-10 8-18 18-18s18 8 18 18v16" stroke="#A5FF8B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="540" cy="718" r="5" fill="#A5FF8B"/>
    <path d="M540 723v8" stroke="#A5FF8B" stroke-width="5" stroke-linecap="round"/>

    <text x="540" y="839" fill="#A7FF8F" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4" text-anchor="middle">FOCUSLOCK • APP SHIELD</text>
    <text x="540" y="916" fill="#F5F8F5" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" text-anchor="middle">Instagram is locked</text>
    <text x="540" y="964" fill="#AAB8B0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="middle">Your daily time limit has been reached.</text>

    <!-- App allowance glass inset -->
    <rect x="174" y="1020" width="732" height="164" rx="28" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
    <circle cx="230" cy="1099" r="32" fill="url(#insta)"/>
    <rect x="209" y="1078" width="42" height="42" rx="13" stroke="#FFF" stroke-width="4"/>
    <circle cx="230" cy="1099" r="10" stroke="#FFF" stroke-width="4"/>
    <circle cx="244" cy="1085" r="3" fill="#FFF"/>
    <text x="282" y="1089" fill="#F2F6F3" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">TODAY'S ALLOWANCE</text>
    <text x="282" y="1139" fill="#F2F6F3" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">1h 00m</text>
    <text x="854" y="1139" fill="#AAB8B0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="end">of 1h</text>
    <rect x="208" y="1158" width="664" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".12"/>
    <rect x="208" y="1158" width="664" height="7" rx="3.5" fill="#76F756"/>

    <!-- Reset countdown -->
    <text x="540" y="1240" fill="#8E9D94" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle">AVAILABLE AGAIN AT</text>
    <text x="540" y="1305" fill="#F5F8F5" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" text-anchor="middle">8:00 AM</text>
    <text x="540" y="1350" fill="#AAB8B0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle">Your limit resets automatically every day.</text>

    <!-- Clear action: leave the restricted app, not bypass the rule -->
    <rect x="174" y="1480" width="732" height="92" rx="28" fill="url(#green)"/>
    <text x="540" y="1538" fill="#0A160B" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing=".4" text-anchor="middle">LEAVE INSTAGRAM</text>
    <path d="M833 1518h27m-11-11 11 11-11 11" stroke="#0A160B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="540" y="1632" fill="#93A198" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" text-anchor="middle">You set the limit. FocusLock keeps your decision.</text>

    <!-- Android gesture handle -->
    <rect x="410" y="1870" width="260" height="9" rx="4.5" fill="#F5F7F6" opacity=".78"/>
  </g>
</svg>
